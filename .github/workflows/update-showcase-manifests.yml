name: Update showcase manifests

on:
  push:
    branches: [ main ]
    paths:
      - 'Resources/Showcases/**/*.png'
      - 'Resources/Showcases/**/*.jpg'
      - 'Resources/Showcases/**/*.jpeg'
      - 'Resources/Showcases/**/*.webp'
      - 'Resources/Showcases/**/*.avif'
      - 'Resources/generate-showcase-manifests.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate showcase manifests
        run: python Resources/generate-showcase-manifests.py
      - name: Commit generated manifests
        shell: bash
        run: |
          if git diff --quiet -- Resources/Showcases Resources/showcase-manifest.js; then
            echo "Showcase manifests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources/Showcases/*/showcase.json Resources/showcase-manifest.js
          git commit -m "Update showcase manifests"
          git push
